spring.application.name=nixathon-2026
spring.config.import=optional:classpath:build.properties,optional:file:./build.properties
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
logging.level.root=INFO
logging.level.me.beratta.nixathon=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [req=%X{requestId}] %logger{36} - %msg%n
